name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE: zzmmrmn/actiondash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version tag
        id: version
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save production-hosting
          kubectl config set-context --current --namespace=zechcodes

      - name: Run database migrations
        run: |
          kubectl delete job actiondash-init-db --ignore-not-found
          sed "s|image: zzmmrmn/actiondash:latest|image: ${{ env.IMAGE }}:${{ steps.version.outputs.TAG }}|" k8s/init-db-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/actiondash-init-db --timeout=120s

      - name: Clean up stuck rollout
        run: |
          # If a previous rollout is stuck, scale to 0 to clear it
          STATUS=$(kubectl rollout status deployment/actiondash --timeout=5s 2>&1 || true)
          if echo "$STATUS" | grep -q "pending\|waiting\|timed out"; then
            echo "Stuck rollout detected, scaling to 0 to reset..."
            kubectl scale deployment/actiondash --replicas=0
            kubectl rollout status deployment/actiondash --timeout=60s || true
          fi

      - name: Deploy with updated manifest
        run: |
          # Apply manifest (updates probes, resource limits, etc.) and set image in one shot
          sed "s|image: zzmmrmn/actiondash:latest|image: ${{ env.IMAGE }}:${{ steps.version.outputs.TAG }}|" \
            k8s/deploy-actiondash.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl rollout status deployment/actiondash --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -l app=actiondash
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -l app=actiondash
