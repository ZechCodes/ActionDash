db:
  url: "$DATABASE_URL"

models:
  - actiondash.models

auth:
  redirect_base_url: "$AUTH_REDIRECT_BASE_URL"
  allowed_redirect_domains:
    - "localhost"
    - "actiondash.zech.sh"
  providers:
    github:
      client_id: "$GITHUB_OAUTH_CLIENT_ID"
      client_secret: "$GITHUB_OAUTH_CLIENT_SECRET"
      scopes: ["read:user", "user:email", "repo", "admin:repo_hook"]

session:
  max_age: 604800
  cookie_domain: "$SESSION_COOKIE_DOMAIN"

security_headers:
  enabled: true
  csp_nonce: true
  content_security_policy: "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; script-src 'self'; connect-src 'self' https://api.github.com; form-action 'self'; base-uri 'self'"

rate_limit:
  enabled: true
  requests_per_minute: 120
  auth_requests_per_minute: 10
  paths:
    "/webhooks": 300

controllers:
  - skrift.controllers.auth:AuthController
  - skrift.admin.controller:AdminController
  - actiondash.controllers:DashboardController
  - actiondash.controllers:RepoController
  - actiondash.controllers:SettingsController
  - actiondash.controllers:HealthController
  - actiondash.controllers:WebhookController
