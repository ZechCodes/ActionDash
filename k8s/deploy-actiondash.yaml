apiVersion: apps/v1
kind: Deployment
metadata:
  name: actiondash
  labels:
    app: actiondash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: actiondash
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        app: actiondash
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: actiondash
      containers:
        - name: actiondash
          image: zzmmrmn/actiondash:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: actiondash-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: actiondash-db
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: secret-key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-webhook-secret
            - name: REDIS_URL
              value: "redis://redis:6379/0"  # CHANGEME: your Redis host
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-secret
            - name: NOTIFICATION_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: notification-webhook-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /healthz/
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8080
            periodSeconds: 10
            failureThreshold: 2
