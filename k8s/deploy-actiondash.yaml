apiVersion: apps/v1
kind: Deployment
metadata:
  name: actiondash
  namespace: zechcodes
  labels:
    app: actiondash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: actiondash
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        app: actiondash
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: actiondash
      containers:
        - name: actiondash
          image: zzmmrmn/actiondash:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: actiondash-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: secret-key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-webhook-secret
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
