apiVersion: apps/v1
kind: Deployment
metadata:
  name: actiondash-step-worker
  labels:
    app: actiondash-step-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actiondash-step-worker
  template:
    metadata:
      labels:
        app: actiondash-step-worker
    spec:
      containers:
        - name: step-worker
          image: zzmmrmn/actiondash:latest
          command: ["uv", "run", "python", "-m", "actiondash.step_worker"]
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: actiondash-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zech-sh-db
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: secret-key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-webhook-secret
            - name: REDIS_URL
              value: "redis://redis:6379/0"  # CHANGEME: your Redis host
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-secret
            - name: NOTIFICATION_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: notification-webhook-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
