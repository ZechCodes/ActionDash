apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actiondash-ingress
  labels:
    app: actiondash
  annotations:
    kubernetes.io/ingress.class: traefik  # CHANGEME: your ingress controller (e.g. nginx, traefik)
    cert-manager.io/cluster-issuer: letsencrypt-production  # CHANGEME: your cluster-issuer name
spec:
  tls:
    - hosts:
        - actiondash.example.com  # CHANGEME: your domain
      secretName: actiondash-tls
  rules:
    - host: actiondash.example.com  # CHANGEME: your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actiondash
                port:
                  number: 8080
