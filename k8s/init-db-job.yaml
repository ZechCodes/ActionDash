apiVersion: batch/v1
kind: Job
metadata:
  name: actiondash-init-db
  labels:
    app: actiondash
    component: init-db
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: actiondash-init-db
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: zzmmrmn/actiondash:latest
          command: ["uv", "run", "skrift", "db", "upgrade", "heads"]
          envFrom:
            - configMapRef:
                name: actiondash-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zech-sh-db
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: secret-key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-webhook-secret
            - name: REDIS_URL
              value: "redis://redis:6379/0"  # CHANGEME: your Redis host
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
