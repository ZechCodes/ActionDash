apiVersion: batch/v1
kind: Job
metadata:
  name: actiondash-init-db
  namespace: zechcodes
  labels:
    app: actiondash
    component: init-db
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: actiondash-init-db
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: zzmmrmn/actiondash:latest
          command:
            - sh
            - -c
            - |
              # If no migrations have been applied yet, stamp all current
              # heads as applied (tables were created before migrations were adopted)
              CURRENT=$(uv run skrift db current 2>/dev/null)
              if [ -z "$CURRENT" ]; then
                echo "No migration history found, stamping current state..."
                uv run skrift db stamp heads
              fi
              uv run skrift db upgrade heads
          envFrom:
            - configMapRef:
                name: actiondash-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: secret-key
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-webhook-secret
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-id
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actiondash-secrets
                  key: github-oauth-client-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
