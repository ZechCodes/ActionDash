# Template for Kubernetes secrets
# Copy this file to secrets.yaml and fill in the base64-encoded values
# DO NOT commit secrets.yaml to version control
#
# To encode a value: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: actiondash-secrets
  namespace: zechcodes
  labels:
    app: actiondash
type: Opaque
data:
  # Database URL (using shared Postgres in smarter-dev namespace)
  # Format: postgresql+asyncpg://user:password@postgres.smarter-dev.svc.cluster.local:5432/actiondash
  database-url: <base64-encoded-database-url>

  # Application secret key (generate a secure random string)
  secret-key: <base64-encoded-secret-key>

  # GitHub webhook secret
  github-webhook-secret: <base64-encoded-github-webhook-secret>

  # GitHub OAuth credentials
  github-oauth-client-id: <base64-encoded-github-oauth-client-id>
  github-oauth-client-secret: <base64-encoded-github-oauth-client-secret>
