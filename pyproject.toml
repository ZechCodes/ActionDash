[project]
name = "actiondash"
version = "2026.02"
description = "Realtime GitHub Actions dashboard built with Skrift"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg",
    "httpx",
    "redis>=5.0",
    "skrift>=0.1.0a41",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
