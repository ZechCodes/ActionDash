{% extends "base.html" %}

{% block title %}Page Not Found - {{ site_name() }}{% endblock %}

{% block head %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Chakra+Petch:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_url('css/neon-base.css') }}">
<style>
    .error-code {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 5rem;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 60%, var(--magenta) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        line-height: 1;
        margin-bottom: 0.5rem;
        text-shadow: none;
    }

    .error-title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1rem;
        letter-spacing: 0.06em;
        color: #e8eef4;
        text-align: center;
        margin-bottom: 0.5rem;
    }

    .error-message {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--text-dim);
        letter-spacing: 0.04em;
        text-align: center;
        margin-bottom: 2rem;
    }

    .error-actions {
        text-align: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="neon-page">
    <a href="/" class="neon-brand">{{ site_name() }}</a>
    <div class="neon-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
        <div class="error-actions">
            <a href="/" class="neon-btn">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
