{% extends "base.html" %}

{% block title %}{{ site_name() }} - GitHub Actions Dashboard{% endblock %}

{% block content %}
<div style="text-align: center; margin: 4rem 0;">
    <h2>GitHub Actions Dashboard</h2>
    <p>Monitor your CI/CD workflows in realtime.</p>
    {% if user %}
    <p><a href="/" style="color: var(--accent, #58a6ff); text-decoration: underline;">Go to Dashboard</a></p>
    {% else %}
    <p><a href="/auth/login" style="color: var(--accent, #58a6ff); text-decoration: underline;">Sign in to continue</a></p>
    {% endif %}
</div>
{% endblock %}
