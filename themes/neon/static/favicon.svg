<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="#06060e"/>
  <g filter="url(#glow)">
    <!-- Three ascending bars (dashboard chart) -->
    <rect x="5" y="19" width="5" height="8" rx="1.2" fill="url(#g)" opacity="0.85"/>
    <rect x="13" y="13" width="5" height="14" rx="1.2" fill="url(#g)" opacity="0.9"/>
    <rect x="21" y="7" width="5" height="20" rx="1.2" fill="url(#g)" opacity="1"/>
  </g>
</svg>
